$kind: http-request
url: "{{baseUrl}}/api/architect/validate"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "clientId": "{{clientId}}",
      "clientSecret": "{{clientSecret}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('established', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json().data.established).to.be.true;
    language: text/javascript
order: 1000
