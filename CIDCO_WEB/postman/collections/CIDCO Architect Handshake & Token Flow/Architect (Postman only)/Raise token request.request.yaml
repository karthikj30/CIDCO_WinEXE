$kind: http-request
url: "{{baseUrl}}/api/architect/token-requests"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "clientId": "{{clientId}}",
      "clientSecret": "{{clientSecret}}",
      "reason": "Current token expiring soon"
    }
scripts:
  - type: afterResponse
    code: pm.test('raised', () => pm.response.to.have.status(201));
    language: text/javascript
order: 4000
