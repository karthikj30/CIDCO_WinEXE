$kind: http-request
description: Demonstrates the 504 the CIDCO protocol returns when validation fails.
url: "{{baseUrl}}/api/architect/validate"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "clientId": "{{clientId}}",
      "clientSecret": "hs_sec_wrong_secret"
    }
scripts:
  - type: afterResponse
    code: pm.test('rejected with 504', () => pm.response.to.have.status(504));
    language: text/javascript
order: 2000
