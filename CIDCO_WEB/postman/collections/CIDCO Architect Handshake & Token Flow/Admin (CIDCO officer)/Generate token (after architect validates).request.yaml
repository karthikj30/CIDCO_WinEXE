$kind: http-request
description: Mints a 7-day API token for the established handshake. Fails with 409 if the architect has not validated yet.
url: "{{baseUrl}}/api/admin/handshakes/{{handshakeId}}/tokens"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "clientId": "{{clientId}}",
      "clientSecret": "{{clientSecret}}",
      "expiresInDays": 7
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('token issued', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('token', pm.response.json().data.token.token);
    language: text/javascript
order: 4000
