$kind: http-request
url: "{{baseUrl}}/api/admin/token-requests/{{tokenRequestId}}/approve"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "expiresInDays": 7
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('approved', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('token', pm.response.json().data.token.token);
    language: text/javascript
order: 6000
